set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -s escape-time 10
set -g history-limit 10000
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 10
set -g status-left-length 40
set -g status-right-length 80
set -g status-left " #S "
set -g status-right " %H:%M  %d %b "

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

if-shell 'defaults read -g AppleInterfaceStyle >/dev/null 2>&1' {
  set -g status-style "fg=#cdd6f4,bg=#1e1e2e"
  set -g window-status-style "fg=#a6adc8,bg=#1e1e2e"
  set -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
  set -g pane-border-style "fg=#313244"
  set -g pane-active-border-style "fg=#89b4fa"
  set -g message-style "fg=#1e1e2e,bg=#f9e2af"
  set -g mode-style "fg=#1e1e2e,bg=#f9e2af"
} {
  set -g status-style "fg=#4c4f69,bg=#eff1f5"
  set -g window-status-style "fg=#6c6f85,bg=#eff1f5"
  set -g window-status-current-style "fg=#eff1f5,bg=#1e66f5,bold"
  set -g pane-border-style "fg=#ccd0da"
  set -g pane-active-border-style "fg=#1e66f5"
  set -g message-style "fg=#eff1f5,bg=#df8e1d"
  set -g mode-style "fg=#eff1f5,bg=#df8e1d"
}
